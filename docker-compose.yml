services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belakang-toko-php
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: belakang-toko-nginx
    ports:
      - "8101:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: belakang-toko-redis
    ports:
      - "6480:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
